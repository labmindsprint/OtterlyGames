name: Website checks

on:
  pull_request:
  push:
    branches:
      - main
      - feature/browser-first-growth

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-checks:
    name: Website checks (Node 22)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Check Space Academy generated pages
        run: node .\scripts\build-space-academy.mjs --check

      - name: Check website generated pages
        if: ${{ !cancelled() }}
        run: node .\scripts\build-site.mjs --check

      - name: Run Node test suites
        if: ${{ !cancelled() }}
        run: node --test (Get-ChildItem -LiteralPath .\scripts -Filter *.test.mjs -File).FullName
