<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <!-- Google Play feature graphic 1024x500. Key content (title, tagline, rocket) sits in the central ~85%. -->
  <defs>
    <style>
      @font-face { font-family: 'Patrick Hand'; src: url('fonts/patrick-hand-latin.woff2') format('woff2'); }
      .title { font-family: 'Patrick Hand', 'Comic Sans MS', cursive; paint-order: stroke fill; stroke: #2b2b2b; stroke-linejoin: round; }
    </style>
    <radialGradient id="sky" cx="700" cy="230" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#25507c"/>
      <stop offset="0.5" stop-color="#14304f"/>
      <stop offset="1" stop-color="#0a1626"/>
    </radialGradient>
    <radialGradient id="glow" cx="800" cy="250" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#83E3D1" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#83E3D1" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="glassClip"><circle cx="256" cy="250" r="108"/></clipPath>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4f3ff"/>
      <stop offset="1" stop-color="#a9d3f5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#sky)"/>
  <circle cx="800" cy="250" r="260" fill="url(#glow)"/>

  <!-- orange planet bottom-left, teal moon top-right -->
  <circle cx="40" cy="520" r="150" fill="#ff8a1f"/>
  <path d="M-60 440 a150 150 0 0 0 190 140 a150 150 0 0 1 -190 -140Z" fill="#c9570f" opacity="0.5"/>
  <circle cx="70" cy="404" r="14" fill="#ffb25c"/><circle cx="150" cy="450" r="9" fill="#ffb25c"/>
  <circle cx="972" cy="56" r="26" fill="#83E3D1"/><circle cx="981" cy="47" r="8" fill="#bff3e8"/>

  <!-- stars -->
  <g fill="#FFD375">
    <path d="M590 64 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6Z"/>
    <path d="M520 420 l4.500 12 12 4.500 -12 4.500 -4.500 12 -4.500 -12 -12 -4.500 12 -4.500Z"/>
    <path d="M965 400 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5Z"/>
  </g>
  <g fill="#fff">
    <circle cx="48" cy="60" r="3"/><circle cx="300" cy="28" r="2.500"/><circle cx="470" cy="40" r="2.500"/>
    <circle cx="640" cy="30" r="2.500"/><circle cx="900" cy="130" r="3"/><circle cx="1000" cy="250" r="2.500"/>
    <circle cx="610" cy="470" r="2.500"/><circle cx="880" cy="470" r="3"/><circle cx="410" cy="470" r="2.500"/>
    <circle cx="560" cy="180" r="2"/><circle cx="20" cy="250" r="2.500"/><circle cx="740" cy="20" r="2"/>
  </g>

  <!-- speed streaks behind the rocket -->
  <g stroke="#83E3D1" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M560 300 L520 366"/><path d="M590 360 L560 410"/><path d="M640 330 L618 366"/>
  </g>

  <!-- rocket + Ringo (same art as icon-master.svg), launching to the upper right -->
  <g transform="translate(832 252) rotate(16) scale(0.78) translate(-256 -262)">
    <g stroke="#2b2b2b" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
      <path d="M198 420 C178 456 226 468 256 496 C286 468 334 456 314 420Z" fill="#ff8a1f"/>
      <path d="M222 420 C216 442 242 452 256 476 C270 452 296 442 290 420Z" fill="#ffd23f"/>
      <path d="M240 420 C240 434 252 440 256 452 C260 440 272 434 272 420Z" fill="#fffbe8" stroke="none"/>
      <g><path d="M132 292 C108 318 78 352 62 392 Q52 438 100 430 L142 408Z" fill="#ff7a1a"/>
        <path d="M118 338 L88 396" fill="none" stroke="#fffdf8" stroke-width="8" opacity="0.7"/></g>
      <g transform="translate(512 0) scale(-1 1)"><path d="M132 292 C108 318 78 352 62 392 Q52 438 100 430 L142 408Z" fill="#ff7a1a"/>
        <path d="M118 338 L88 396" fill="none" stroke="#fffdf8" stroke-width="8" opacity="0.7"/></g>
      <path d="M190 404 H322 L340 438 H172Z" fill="#2f3650"/>
      <path d="M256 30 C330 80 396 170 396 270 L396 408 H116 L116 270 C116 170 182 80 256 30Z" fill="#fffdf8"/>
      <path d="M356 118 C382 160 394 210 394 270 V406 H350 V270 C350 210 340 150 322 100Z" fill="#2b2b2b" opacity="0.13" stroke="none"/>
      <path d="M256 30 C286 52 314 82 338 114 Q256 130 174 114 C198 82 226 52 256 30Z" fill="#ff6b2c"/>
      <path d="M116 380 H396 V408 H116Z" fill="#83E3D1"/>
      <circle cx="256" cy="250" r="132" fill="#83E3D1"/>
      <circle cx="256" cy="250" r="108" fill="url(#glass)"/>
    </g>
    <g clip-path="url(#glassClip)">
      <g transform="translate(256 250) scale(3.2) translate(-32 -34)">
        <circle cx="14" cy="16" r="8" fill="#b9855a" stroke="#2b2b2b" stroke-width="3"/><circle cx="50" cy="16" r="8" fill="#b9855a" stroke="#2b2b2b" stroke-width="3"/>
        <circle cx="32" cy="34" r="25" fill="#b9855a" stroke="#2b2b2b" stroke-width="3"/>
        <ellipse cx="32" cy="43" rx="15" ry="11" fill="#efe6d2" stroke="#2b2b2b" stroke-width="2.500"/>
        <circle cx="23" cy="29" r="3.600" fill="#2b2b2b"/><circle cx="41" cy="29" r="3.600" fill="#2b2b2b"/>
        <circle cx="24.200" cy="27.800" r="1.200" fill="#fff"/><circle cx="42.200" cy="27.800" r="1.200" fill="#fff"/>
        <ellipse cx="32" cy="37" rx="4.200" ry="3" fill="#2b2b2b"/>
        <path d="M24 41q8 10 16 0Z" fill="#fff" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </g>
    <g fill="none" stroke="#2b2b2b" stroke-width="10"><circle cx="256" cy="250" r="132"/><circle cx="256" cy="250" r="108"/></g>
  </g>

  <!-- title -->
  <g class="title" text-anchor="start">
    <text x="78" y="214" font-size="168" fill="#ff8a1f" stroke-width="16" transform="rotate(-3 78 214)">Otterly</text>
    <text x="84" y="318" font-size="104" fill="#fffdf8" stroke-width="12" transform="rotate(-3 84 318)">Space Academy</text>
  </g>

  <!-- tagline ribbon -->
  <g transform="rotate(-3 84 400)">
    <rect x="78" y="358" width="528" height="76" rx="16" fill="#83E3D1" stroke="#2b2b2b" stroke-width="7"/>
    <text x="342" y="412" font-family="'Patrick Hand', 'Comic Sans MS', cursive" font-size="44" fill="#102237" text-anchor="middle">Olympiad maths, rocket-fast</text>
  </g>
</svg>
