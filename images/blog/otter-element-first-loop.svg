<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">The Otter Element preview loop</title><desc id="d">The tower fights, you earn credits, you train Attack, Health, Repair or Resonance, you clear nodes and the next element is discovered.</desc>
<rect width="900" height="360" rx="24" fill="#1d1946"/>
<text x="450" y="44" font-size="26" fill="#f6f3ff" font-weight="700" text-anchor="middle">The first-minutes loop in the browser preview</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffc94d"/></marker></defs>
<rect x="24" y="90" width="150" height="170" rx="18" fill="#2c2766" stroke="#ffc94d" stroke-width="3"/>
<text x="99" y="132" font-size="24" fill="#ffc94d" font-weight="800" text-anchor="middle">Fight</text>
<text x="99" y="168" font-size="17" fill="#f6f3ff" font-weight="400" text-anchor="middle"><tspan x="99" dy="0">The tower</tspan><tspan x="99" dy="23">fires by</tspan><tspan x="99" dy="23">itself</tspan></text>
<line x1="177" y1="175" x2="198" y2="175" stroke="#ffc94d" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="202" y="90" width="150" height="170" rx="18" fill="#2c2766" stroke="#b79cff" stroke-width="3"/>
<text x="277" y="132" font-size="24" fill="#b79cff" font-weight="800" text-anchor="middle">Earn</text>
<text x="277" y="168" font-size="17" fill="#f6f3ff" font-weight="400" text-anchor="middle"><tspan x="277" dy="0">Wins pay</tspan><tspan x="277" dy="23">credits</tspan></text>
<line x1="355" y1="175" x2="376" y2="175" stroke="#b79cff" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="380" y="90" width="150" height="170" rx="18" fill="#2c2766" stroke="#5fe0c0" stroke-width="3"/>
<text x="455" y="132" font-size="24" fill="#5fe0c0" font-weight="800" text-anchor="middle">Train</text>
<text x="455" y="168" font-size="17" fill="#f6f3ff" font-weight="400" text-anchor="middle"><tspan x="455" dy="0">Attack,</tspan><tspan x="455" dy="23">Health, Repair</tspan><tspan x="455" dy="23">or Resonance</tspan></text>
<line x1="533" y1="175" x2="554" y2="175" stroke="#5fe0c0" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="558" y="90" width="150" height="170" rx="18" fill="#2c2766" stroke="#ff8fb3" stroke-width="3"/>
<text x="633" y="132" font-size="24" fill="#ff8fb3" font-weight="800" text-anchor="middle">Clear</text>
<text x="633" y="168" font-size="17" fill="#f6f3ff" font-weight="400" text-anchor="middle"><tspan x="633" dy="0">Finish the</tspan><tspan x="633" dy="23">node’s waves</tspan></text>
<line x1="711" y1="175" x2="732" y2="175" stroke="#ff8fb3" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="736" y="90" width="150" height="170" rx="18" fill="#2c2766" stroke="#ffc94d" stroke-width="3"/>
<text x="811" y="132" font-size="24" fill="#ffc94d" font-weight="800" text-anchor="middle">Discover</text>
<text x="811" y="168" font-size="17" fill="#f6f3ff" font-weight="400" text-anchor="middle"><tspan x="811" dy="0">Hydrogen, then</tspan><tspan x="811" dy="23">Helium</tspan></text>
<path d="M780 266 Q780 322 450 322 Q120 322 100 266" fill="none" stroke="#c9c2ee" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arr)"/>
<text x="450" y="346" font-size="18" fill="#c9c2ee" font-weight="400" text-anchor="middle">Training is spent on the tower; the fight repeats on its own.</text>
</svg>
