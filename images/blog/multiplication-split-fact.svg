<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">Splitting 7 times 6 into 5 times 6 plus 2 times 6</title><desc id="d">An array with 7 rows of 6 dots. The top 5 rows hold 30 dots and the bottom 2 rows hold 12 dots, so 7 times 6 is 42.</desc>
<rect width="900" height="460" rx="24" fill="#1d1946"/>
<text x="450" y="46" font-size="26" fill="#f6f3ff" font-weight="700" text-anchor="middle">Build a harder fact from an easier one: 7 × 6</text>
<circle cx="110" cy="100" r="12" fill="#ffc94d"/>
<circle cx="148" cy="100" r="12" fill="#ffc94d"/>
<circle cx="186" cy="100" r="12" fill="#ffc94d"/>
<circle cx="224" cy="100" r="12" fill="#ffc94d"/>
<circle cx="262" cy="100" r="12" fill="#ffc94d"/>
<circle cx="300" cy="100" r="12" fill="#ffc94d"/>
<circle cx="110" cy="136" r="12" fill="#ffc94d"/>
<circle cx="148" cy="136" r="12" fill="#ffc94d"/>
<circle cx="186" cy="136" r="12" fill="#ffc94d"/>
<circle cx="224" cy="136" r="12" fill="#ffc94d"/>
<circle cx="262" cy="136" r="12" fill="#ffc94d"/>
<circle cx="300" cy="136" r="12" fill="#ffc94d"/>
<circle cx="110" cy="172" r="12" fill="#ffc94d"/>
<circle cx="148" cy="172" r="12" fill="#ffc94d"/>
<circle cx="186" cy="172" r="12" fill="#ffc94d"/>
<circle cx="224" cy="172" r="12" fill="#ffc94d"/>
<circle cx="262" cy="172" r="12" fill="#ffc94d"/>
<circle cx="300" cy="172" r="12" fill="#ffc94d"/>
<circle cx="110" cy="208" r="12" fill="#ffc94d"/>
<circle cx="148" cy="208" r="12" fill="#ffc94d"/>
<circle cx="186" cy="208" r="12" fill="#ffc94d"/>
<circle cx="224" cy="208" r="12" fill="#ffc94d"/>
<circle cx="262" cy="208" r="12" fill="#ffc94d"/>
<circle cx="300" cy="208" r="12" fill="#ffc94d"/>
<circle cx="110" cy="244" r="12" fill="#ffc94d"/>
<circle cx="148" cy="244" r="12" fill="#ffc94d"/>
<circle cx="186" cy="244" r="12" fill="#ffc94d"/>
<circle cx="224" cy="244" r="12" fill="#ffc94d"/>
<circle cx="262" cy="244" r="12" fill="#ffc94d"/>
<circle cx="300" cy="244" r="12" fill="#ffc94d"/>
<circle cx="110" cy="280" r="12" fill="#b79cff"/>
<circle cx="148" cy="280" r="12" fill="#b79cff"/>
<circle cx="186" cy="280" r="12" fill="#b79cff"/>
<circle cx="224" cy="280" r="12" fill="#b79cff"/>
<circle cx="262" cy="280" r="12" fill="#b79cff"/>
<circle cx="300" cy="280" r="12" fill="#b79cff"/>
<circle cx="110" cy="316" r="12" fill="#b79cff"/>
<circle cx="148" cy="316" r="12" fill="#b79cff"/>
<circle cx="186" cy="316" r="12" fill="#b79cff"/>
<circle cx="224" cy="316" r="12" fill="#b79cff"/>
<circle cx="262" cy="316" r="12" fill="#b79cff"/>
<circle cx="300" cy="316" r="12" fill="#b79cff"/>
<line x1="55" y1="82" x2="55" y2="226" stroke="#ffc94d" stroke-width="4" stroke-linecap="round"/>
<line x1="55" y1="244" x2="55" y2="316" stroke="#b79cff" stroke-width="4" stroke-linecap="round"/>
<text x="40" y="156" font-size="24" fill="#ffc94d" font-weight="800" text-anchor="end">5</text>
<text x="40" y="288" font-size="24" fill="#b79cff" font-weight="800" text-anchor="end">2</text>
<text x="60" y="358" font-size="15" fill="#c9c2ee" font-weight="400" text-anchor="end">rows</text>
<text x="370" y="150" font-size="28" fill="#ffc94d" font-weight="800" text-anchor="start">5 × 6 = 30</text>
<text x="370" y="186" font-size="17" fill="#c9c2ee" font-weight="400" text-anchor="start">(five rows: easy to count in 5s)</text>
<text x="370" y="262" font-size="28" fill="#b79cff" font-weight="800" text-anchor="start">2 × 6 = 12</text>
<text x="370" y="298" font-size="17" fill="#c9c2ee" font-weight="400" text-anchor="start">(two rows: double 6)</text>
<rect x="370" y="322" width="470" height="66" rx="14" fill="#2c2766"/>
<text x="394" y="364" font-size="26" fill="#f6f3ff" font-weight="700" text-anchor="start">30 + 12 = 42, so 7 × 6 = 42</text>
<text x="40" y="420" font-size="17" fill="#c9c2ee" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Try it with any hard fact: split one factor into 5 and something small, then add</tspan><tspan x="40" dy="23">the two products.</tspan></text>
</svg>
