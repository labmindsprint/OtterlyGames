<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
<title id="t">From equal groups to an array: 3 times 4</title><desc id="d">Three groups of four dots become three rows of four dots. Both show 12. Turning the array gives 4 times 3, also 12.</desc>
<rect width="900" height="440" rx="24" fill="#1d1946"/>
<text x="450" y="46" font-size="26" fill="#f6f3ff" font-weight="700" text-anchor="middle">3 × 4 as equal groups, then as an array</text>
<text x="210" y="92" font-size="19" fill="#ffc94d" font-weight="700" text-anchor="middle">Equal groups (Math Tank’s model)</text>
<rect x="40" y="112" width="118" height="62" rx="14" fill="#2c2766" stroke="#ffc94d" stroke-width="2"/>
<circle cx="60" cy="143" r="9" fill="#ffc94d"/>
<circle cx="86" cy="143" r="9" fill="#ffc94d"/>
<circle cx="112" cy="143" r="9" fill="#ffc94d"/>
<circle cx="138" cy="143" r="9" fill="#ffc94d"/>
<text x="99" y="198" font-size="15" fill="#c9c2ee" font-weight="400" text-anchor="middle">Group 1</text>
<rect x="174" y="112" width="118" height="62" rx="14" fill="#2c2766" stroke="#ffc94d" stroke-width="2"/>
<circle cx="194" cy="143" r="9" fill="#ffc94d"/>
<circle cx="220" cy="143" r="9" fill="#ffc94d"/>
<circle cx="246" cy="143" r="9" fill="#ffc94d"/>
<circle cx="272" cy="143" r="9" fill="#ffc94d"/>
<text x="233" y="198" font-size="15" fill="#c9c2ee" font-weight="400" text-anchor="middle">Group 2</text>
<rect x="308" y="112" width="118" height="62" rx="14" fill="#2c2766" stroke="#ffc94d" stroke-width="2"/>
<circle cx="328" cy="143" r="9" fill="#ffc94d"/>
<circle cx="354" cy="143" r="9" fill="#ffc94d"/>
<circle cx="380" cy="143" r="9" fill="#ffc94d"/>
<circle cx="406" cy="143" r="9" fill="#ffc94d"/>
<text x="367" y="198" font-size="15" fill="#c9c2ee" font-weight="400" text-anchor="middle">Group 3</text>
<text x="210" y="236" font-size="20" fill="#f6f3ff" font-weight="600" text-anchor="middle">3 groups of 4</text>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5fe0c0"/></marker></defs>
<line x1="450" y1="143" x2="520" y2="143" stroke="#5fe0c0" stroke-width="4" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="640" y="92" font-size="19" fill="#b79cff" font-weight="700" text-anchor="middle">The same 12 as an array</text>
<circle cx="560" cy="122" r="11" fill="#b79cff"/>
<circle cx="594" cy="122" r="11" fill="#b79cff"/>
<circle cx="628" cy="122" r="11" fill="#b79cff"/>
<circle cx="662" cy="122" r="11" fill="#b79cff"/>
<circle cx="560" cy="156" r="11" fill="#b79cff"/>
<circle cx="594" cy="156" r="11" fill="#b79cff"/>
<circle cx="628" cy="156" r="11" fill="#b79cff"/>
<circle cx="662" cy="156" r="11" fill="#b79cff"/>
<circle cx="560" cy="190" r="11" fill="#b79cff"/>
<circle cx="594" cy="190" r="11" fill="#b79cff"/>
<circle cx="628" cy="190" r="11" fill="#b79cff"/>
<circle cx="662" cy="190" r="11" fill="#b79cff"/>
<text x="640" y="258" font-size="17" fill="#c9c2ee" font-weight="400" text-anchor="middle">3 rows × 4 in each row</text>
<rect x="40" y="292" width="820" height="120" rx="16" fill="#2c2766"/>
<text x="64" y="334" font-size="26" fill="#f6f3ff" font-weight="700" text-anchor="start">3 × 4 = 4 + 4 + 4 = 12</text>
<text x="64" y="374" font-size="21" fill="#c9c2ee" font-weight="400" text-anchor="start">Turn the array: 4 × 3 = 3 + 3 + 3 + 3 = 12. Same dots, so the same total.</text>
<text x="64" y="402" font-size="17" fill="#5fe0c0" font-weight="400" text-anchor="start">The array is our extra picture; the game’s lesson draws the groups.</text>
</svg>
